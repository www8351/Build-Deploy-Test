  <circle cx="62" cy="18" r="6" fill="#27c93f"/>
  <text x="380" y="23" fill="#8b949e" text-anchor="middle">build-deploy-test — make test &amp; job demo</text>
  <g>
    <text x="20" y="70"><tspan fill="#58a6ff">~/build-deploy-test</tspan><tspan fill="#c9d1d9"> $ </tspan><tspan fill="#e6edf3">make test</tspan></text>
    <text x="20" y="94" fill="#8b949e">tests/python ..............................  [pytest]</text>
    <text x="20" y="118"><tspan fill="#3fb950">39 passed, 1 skipped</tspan><tspan fill="#8b949e"> — coverage </tspan><tspan fill="#3fb950">94%</tspan><tspan fill="#8b949e"> (jobs/*.py)</tspan></text>
    <text x="20" y="142"><tspan fill="#3fb950">✓</tspan><tspan fill="#8b949e"> tests/bats  16 tests  (jobs 7/8/10/13/15)</tspan></text>

    <text x="20" y="182"><tspan fill="#58a6ff">~/build-deploy-test</tspan><tspan fill="#c9d1d9"> $ </tspan><tspan fill="#e6edf3">THRESHOLD=0 ./jobs/job8_trivy_docker_scan.sh</tspan></text>
    <text x="20" y="206" fill="#8b949e">Found 2 HIGH,CRITICAL vulnerabilities (threshold: 0).</text>
    <text x="20" y="230"><tspan fill="#f85149">✗ exceeds threshold — blocking deployment</tspan><tspan fill="#8b949e">   (exit 1)</tspan></text>

    <text x="20" y="270"><tspan fill="#58a6ff">~/build-deploy-test</tspan><tspan fill="#c9d1d9"> $ </tspan><tspan fill="#e6edf3">DRY_RUN=1 ./jobs/job10_iptables_lockdown.sh</tspan></text>
    <text x="20" y="294" fill="#8b949e">:INPUT DROP [0:0]</text>
    <text x="20" y="318" fill="#8b949e">-A INPUT -p tcp --dport 8351 -m conntrack --ctstate NEW -j ACCEPT</text>
    <text x="20" y="342"><tspan fill="#3fb950">✓</tspan><tspan fill="#8b949e"> Done: dry run, no rules applied.</tspan></text>

    <text x="20" y="382"><tspan fill="#58a6ff">~/build-deploy-test</tspan><tspan fill="#c9d1d9"> $ </tspan><tspan fill="#e6edf3">DRY_RUN=1 ./jobs/job15_aws_ec2_provision.sh</tspan></text>
    <text x="20" y="406" fill="#8b949e">run-instances --metadata-options HttpTokens=required</text>
    <text x="20" y="430"><tspan fill="#3fb950">✓</tspan><tspan fill="#8b949e"> Done: dry run.  (IMDSv2 enforced, no AWS calls)</tspan></text>
