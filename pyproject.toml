[project]
name = "devops-automation-labs"
version = "0.1.0"
description = "DevOps automation labs - build/deploy jobs plus a security & cloud backlog"
requires-python = ">=3.9"
dependencies = [
    "aiohttp>=3.9",   # job11 - async API health monitor
    "pydantic>=2.6",  # job11 - response schema validation
]

[project.optional-dependencies]
gcp = ["google-cloud-resource-manager>=1.12"]  # job18 - IAM audit
dev = [
    "ruff==0.15.21",         # pinned: ruff defines which S (bandit) rules fire — the
                             # security gate must be deterministic (uv.lock is gitignored)
    "pytest>=8.0",
    "pytest-cov>=5.0",       # coverage of jobs/*.py
    "pytest-aiohttp>=1.0",   # loopback server + asyncio loop for job11 probe tests
]

# uv manages the virtualenv + a reproducible uv.lock. This repo is a collection
# of scripts, not an installable package, so disable packaging.
#   uv sync --all-extras        # create .venv and resolve deps
#   uv run ruff check labs jobs # lint through the managed env
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# pyflakes(F), pycodestyle(E,W), isort(I), pyupgrade(UP), bugbear(B),
# flake8-bandit(S) — SAST on the Python jobs (the repo scans its own code).
select = ["E", "F", "W", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests assert by design; S101 (assert) is the tool working, not a finding.
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
asyncio_mode = "auto"
addopts = "-q"

# Coverage is scoped to the Python jobs only. The shell jobs (7/10/13/15) and the
# docker build jobs (1-6) are not measurable by coverage.py; they are exercised by
# the bats suite (tests/bats) instead. See README "Testing".
[tool.coverage.run]
source = ["jobs"]
omit = ["jobs/*.sh"]
# Record relative paths so the coverage data is portable into the
# python-coverage-comment-action container (else it errors "No source for code").
relative_files = true

[tool.coverage.report]
show_missing = true
