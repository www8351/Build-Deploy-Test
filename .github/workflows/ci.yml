name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shell:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n syntax check
        run: |
          set -euo pipefail
          for f in labs/*.sh jobs/*.sh; do
            bash -n "$f"
            echo "syntax OK: $f"
          done

      - name: ShellCheck
        run: shellcheck labs/*.sh jobs/*.sh

  python:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Resolve deps (uv)
        run: uv sync --all-extras

      - name: Ruff (uv)
        run: uv run ruff check labs jobs tests

      - name: Compile (uv)
        run: uv run python -m compileall -q labs jobs

  python-test:
    name: Python tests
    runs-on: ubuntu-latest
    permissions:
      contents: write        # coverage action stores the badge on a data branch
      pull-requests: write    # ...and posts a coverage comment on PRs
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Resolve deps (uv)
        run: uv sync --all-extras

      - name: pytest + coverage (jobs/*.py)
        run: |
          uv run pytest tests/python \
            --cov=jobs --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=80

      # Badge + PR comment, self-contained (no third-party service). Only the
      # 3.12 leg publishes so the matrix doesn't race on the data branch.
      - name: Coverage badge + PR comment
        if: matrix.python-version == '3.12'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 80
          MINIMUM_ORANGE: 60

  bats-test:
    name: Shell tests (bats)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up bats
        uses: bats-core/bats-action@3.0.0
        with:
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false

      - name: Run bats
        run: bats tests/bats

  terraform:
    name: OpenTofu validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: Format check
        run: tofu fmt -check -recursive infra

      - name: Init (no backend) + validate
        run: |
          tofu -chdir=infra init -backend=false
          tofu -chdir=infra validate
