name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shell:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n syntax check
        run: |
          set -euo pipefail
          for f in labs/*.sh jobs/*.sh; do
            bash -n "$f"
            echo "syntax OK: $f"
          done

      - name: ShellCheck
        run: shellcheck labs/*.sh jobs/*.sh

  python:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: py_compile
        run: python -m py_compile labs/lab2_menu.py

      - name: Ruff
        run: |
          python -m pip install --quiet ruff
          python -m ruff check labs/
