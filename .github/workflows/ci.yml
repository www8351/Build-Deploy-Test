name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shell:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n syntax check
        run: |
          set -euo pipefail
          for f in labs/*.sh jobs/*.sh; do
            bash -n "$f"
            echo "syntax OK: $f"
          done

      - name: ShellCheck
        run: shellcheck labs/*.sh jobs/*.sh

  python:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Resolve deps (uv)
        run: uv sync --all-extras

      - name: Ruff (uv)
        run: uv run ruff check labs jobs

      - name: Compile (uv)
        run: uv run python -m compileall -q labs jobs
